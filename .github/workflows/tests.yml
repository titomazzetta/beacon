name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest pyflakes
      - run: python -m pyflakes beacon tests
      - run: python -m pytest -q
      - run: bash -n scripts/build_usb.sh && bash -n scripts/launch.sh && bash -n "scripts/Beacon (with Terminal).command"
      - if: runner.os == 'macOS'
        run: osacompile -o "$RUNNER_TEMP/Beacon.app" scripts/Beacon.applescript
